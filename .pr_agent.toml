# PR-Agent settings for this repository. PR-Agent reads this file from the
# default branch (main).
# Options: https://github.com/The-PR-Agent/pr-agent/blob/v0.50.0/pr_agent/settings/configuration.toml

[github_app]
# Review draft pull requests too, and run /describe and /review again on every push.
feedback_on_draft_pr = true
handle_push_trigger = true

[pr_reviewer]
num_max_findings = 5
extra_instructions = """\
Also check these rules:

Pages (`src/pages/`, `src/components/`, `src/layouts/BaseLayout.astro`):
- Site text is Czech. A new page uses `BaseLayout` with a `title` in the form `Page name · TREMI s.r.o.` and passes a `description` when the default does not fit.
- Every `<img>` has a descriptive Czech `alt`. Internal links match a page in `src/pages/` or a file in `public/`. A new menu page is added to `defaultLinks` in `src/components/Nav.astro`.
- Phone and fax numbers appear in both `About.astro` and `Contact.astro`; a change updates both.

Static assets (`public/`):
- Files in `public/` are served as-is by absolute path. A renamed or removed file leaves no reference in `src/`.
- `BaseLayout.astro` loads scripts with `is:inline` in this order: jQuery, scrolly, scrollex, skel, `util.js`, `main.js`. `main.js` depends on all of them.
- Any edit to `public/.well-known/security.txt` adds or updates an `Expires` date in the future (RFC 9116) and regenerates `security.txt.sig` in the same PR.

Build and deploy (`astro.config.mjs`, `.github/workflows/build-and-deploy.yml`):
- Dependencies use Bun: `bun.lock` changes with `package.json`, and no `package-lock.json` is added. The site builds with `bun run build` to static `dist/`.
- Deploy runs only on push to `main` or `master`; pull requests only build. Permissions stay `contents: read`, `pages: write` and `id-token: write`.
"""

[pr_code_suggestions]
# Publish only suggestions scored 5 or higher (0-10).
suggestions_score_threshold = 5
extra_instructions = "Prefer existing project helpers and patterns over new abstractions. Do not suggest edits to minified or vendored files (`*.min.js`, `*.min.css`, `public/js/ie/`) or to the generated `public/.well-known/security.txt.sig`."

[ignore]
# Generated code and lock files. Replaces the default list; keep vendor/** first.
glob = [
    "vendor/**",
    "**/*.min.js",
    "**/*.min.css",
    "public/js/ie/**",
]
